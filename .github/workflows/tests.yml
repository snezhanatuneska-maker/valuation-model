name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      # The browser checks of the wizard (tests/test_frontend.py) are skipped without Playwright and Chromium.
      - run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - run: python -m pytest -q
